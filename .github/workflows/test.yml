name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          RAW_AUDIO_DIR: raw_audio
          PROCESSED_AUDIO_DIR: processed_audio
          STAGING_AUDIO_DIR: staging_audio
          VERIFIED_AUDIO_DIR: verified_audio
          VIDEOS_DIR: verified_audio/Videos
          PCO_APP_ID: mock_app_id
          PCO_SECRET: mock_secret
          GEMINI_API_KEY: mock_gemini_api_key
        run: |
          python run_tests.py
